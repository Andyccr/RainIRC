name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: dist
        run: make dist VERSION=${GITHUB_REF_NAME#v} COMMIT=${GITHUB_SHA::7}
      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "p2pirc ${GITHUB_REF_NAME} static binaries. See CHANGELOG.md."
